
<!doctype html>

<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="utf-8">


    <!-- Responsive Viewport -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <!-- Dynamic Page Title -->
    <title>
        {% block title %}
            Suprajit
        {% endblock %}
    </title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom Application CSS -->
    <link
        href="{{ url_for('static', path='app.css') }}?v=20260830-11"
        rel="stylesheet"
    >

</head>


<body>

    <!-- Page-Specific Content -->
    {% block body %}
    {% endblock %}


    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
